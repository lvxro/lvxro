name: Actualizar perfil

on:
  schedule:
    - cron: "17 6 * * *" # todos los dias 03:17 de Argentina
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generar tarjeta neofetch
        run: python3 generar.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # PERFIL_TOKEN es opcional: un token personal para contar tambien lo privado
          GITHUB_TOKEN: ${{ secrets.PERFIL_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generar viborita
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg dist
          git diff --cached --quiet || git commit -m "chore: actualizar tarjeta y viborita"
          git push
